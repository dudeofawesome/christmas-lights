name: Build and publish

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  controller:
    name: Controller Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            system: x86_64-linux
            runner: ubuntu-24.04
          - arch: arm64
            system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
      - name: Evaluate flake outputs
        run: nix flake check --all-systems --no-build
      - name: Build controller and image
        id: build
        env:
          NIX_SYSTEM: ${{ matrix.system }}
        run: |
          nix build \
            ".#packages.${NIX_SYSTEM}.christmas-lights" \
            --out-link result-controller -L
          nix build \
            ".#packages.${NIX_SYSTEM}.container-image" \
            --out-link result-image -L
          version=$(nix eval --raw \
            ".#packages.${NIX_SYSTEM}.christmas-lights.version")
          echo "image=ghcr.io/dudeofawesome/christmas-lights:$version" >> "$GITHUB_OUTPUT"
      - name: Smoke-test packages and container
        env:
          IMAGE_ARCH: ${{ matrix.arch }}
          BUILT_IMAGE: ${{ steps.build.outputs.image }}
        run: |
          python3 scripts/smoke-controller.py result-controller
          python3 scripts/check-image.py result-image "$IMAGE_ARCH"
          docker load < result-image
          bash scripts/smoke-container.sh "$BUILT_IMAGE"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_ARCH: ${{ matrix.arch }}
          BUILT_IMAGE: ${{ steps.build.outputs.image }}
        run: |
          image=ghcr.io/dudeofawesome/christmas-lights
          docker tag "$BUILT_IMAGE" "$image:sha-${GITHUB_SHA}-${IMAGE_ARCH}"
          docker push "$image:sha-${GITHUB_SHA}-${IMAGE_ARCH}"

  firmware:
    name: Firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
      - name: Build firmware
        env:
          NIX_SYSTEM: x86_64-linux
        run: |
          nix build \
            ".#packages.${NIX_SYSTEM}.relay-firmware-leonardo" \
            --out-link result/leonardo -L
          nix build \
            ".#packages.${NIX_SYSTEM}.relay-firmware-promicro" \
            --out-link result/promicro -L
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firmware
          path: |
            result/leonardo/*
            result/promicro/*
          if-no-files-found: error

  manifest:
    name: Publish multi-architecture manifest
    needs: [controller]
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Publish and verify manifest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          image=ghcr.io/dudeofawesome/christmas-lights
          docker buildx imagetools create \
            --tag "$image:sha-${GITHUB_SHA}" \
            --tag "$image:latest" \
            "$image:sha-${GITHUB_SHA}-amd64" \
            "$image:sha-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect \
            "$image:sha-${GITHUB_SHA}" --raw > manifest.json
          python3 - <<'PY'
          import json
          with open('manifest.json') as stream:
              manifest = json.load(stream)
          platforms = {(item['platform']['os'], item['platform']['architecture'])
                       for item in manifest['manifests']}
          assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms, platforms
          PY
          docker buildx imagetools inspect "$image:sha-${GITHUB_SHA}" \
            >> "$GITHUB_STEP_SUMMARY"
